version: '3.8'

services:
  api:
    build:
      context: .
      target: production
    container_name: exambank_api
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://postgres:password@postgres:5432/exambank?schema=public
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=super_secret_jwt_key
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - exambank_net
    restart: always

  postgres:
    image: postgres:15-alpine
    container_name: exambank_postgres
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=exambank
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d exambank"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - exambank_net

  redis:
    image: redis:7-alpine
    container_name: exambank_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - exambank_net

volumes:
  postgres_data:
  redis_data:

networks:
  exambank_net:
    driver: bridge
