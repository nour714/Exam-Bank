<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Exam Bank | منصة المراجعة الشاملة لطلاب الثانوية العامة</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="apple-touch-icon" href="/assets/images/icon-192.png">
    <!-- Google Fonts: Tajawal -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800;900&display=swap" rel="stylesheet">
    <!-- Lucide Icons -->
    <script defer src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js"></script>
    <!-- Chart.js (required by design-system/components/charts/chart-view.js) -->
    <script defer src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
    <!-- PWA Manifest -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#6366f1">
    <meta name="description" content="منصة تعليمية شاملة لطلاب الثانوية العامة مع بنك أسئلة تفاعلي وامتحانات محاكاة">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Exam Bank">
    <script>
        (function() {
            const savedDarkMode = localStorage.getItem("darkMode");
            if (savedDarkMode !== "false") {
                document.documentElement.classList.add("dark-theme");
                document.body && document.body.classList.add("dark-theme");
            }
        })();
    </script>
    <!-- Design System Stylesheets (order matters: reset -> theme tokens -> utilities -> components) -->
    <link rel="stylesheet" href="/src/design-system/reset.css">
    <link rel="stylesheet" href="/src/design-system/theme.css">
    <link rel="stylesheet" href="/src/design-system/utilities.css">
    <link rel="stylesheet" href="/src/design-system/components.css">
</head>
<body class="dark-theme">
    <!-- App Shell: matches #app-root/.sidebar/.app-container/#app-content/#app-main contract in design-system CSS -->
    <div id="app-root">
        <div id="app-sidebar"></div>

        <div class="app-container">
            <div id="app-content">
                <div id="app-header-container"></div>
                <main id="app-main"></main>
            </div>
        </div>
    </div>

    <!-- Toast Notification Container -->
    <div class="toast-container" id="toast-container"></div>

    <!-- Modal Container (required by design-system/components/overlays/modal.js) -->
    <div id="modal-container"></div>

    <!-- Mobile Bottom Navigation (visible only under 768px) -->
    <div id="mobile-bottom-nav-container"></div>

    <!-- Main Application (ES Module SPA) -->
    <script type="module" src="/src/app.js"></script>

    <!-- Service Worker Registration for PWA -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/service-worker.js', { scope: '/' })
                    .then(registration => {
                        console.log('✅ Service Worker registered successfully:', registration);
                        setInterval(() => { registration.update(); }, 1000 * 60 * 2);
                    })
                    .catch(error => {
                        console.warn('⚠️  Service Worker registration failed:', error);
                    });

                let swRefreshing = false;
                navigator.serviceWorker.addEventListener('controllerchange', () => {
                    if (!swRefreshing) {
                        swRefreshing = true;
                        window.location.reload();
                    }
                });
            });
        }
    </script>
</body>
</html>
