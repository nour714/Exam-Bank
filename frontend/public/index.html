<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Exam Bank | منصة المراجعة الشاملة لطلاب الثانوية العامة</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="apple-touch-icon" href="/assets/images/icon-192.png">
    
    <!-- Google Fonts: Tajawal & Cairo -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800;900&family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    
    <!-- Lucide Icons -->
    <script defer src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js"></script>
    
    <!-- PWA Manifest -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#2F5FA8">
    <meta name="description" content="منصة تعليمية شاملة لطلاب الثانوية العامة مع بنك أسئلة تفاعلي وامتحانات محاكاة">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Exam Bank">

    <script>
        (function() {
            const savedDarkMode = localStorage.getItem("darkMode");
            if (savedDarkMode !== "false") {
                document.documentElement.classList.add("dark-theme");
            } else {
                document.documentElement.classList.remove("dark-theme");
            }
            document.addEventListener('DOMContentLoaded', function() {
                if (localStorage.getItem("darkMode") !== "false") {
                    document.body.classList.add("dark-theme");
                } else {
                    document.body.classList.remove("dark-theme");
                }
            });
        })();
    </script>

    <!-- Design System Stylesheets -->
    <link rel="stylesheet" href="/src/design-system/reset.css">
    <link rel="stylesheet" href="/src/design-system/theme.css">
    <link rel="stylesheet" href="/src/design-system/utilities.css">
    <link rel="stylesheet" href="/src/design-system/components.css">
    <link rel="stylesheet" href="/src/design-system/components/layout/layout.css">
</head>
<body class="antialiased">
    <!-- Animated background -->
    <div class="animated-bg" aria-hidden="true">
        <div class="animated-bg__mesh"></div>
        <div class="animated-bg__aurora"></div>
        <div class="animated-bg__orb animated-bg__orb--1"></div>
        <div class="animated-bg__orb animated-bg__orb--2"></div>
        <div class="animated-bg__orb animated-bg__orb--3"></div>
        <div class="animated-bg__grid"></div>
        <div class="animated-bg__shine"></div>
    </div>

    <!-- App Skeleton Loading Screen -->
    <div id="app-skeleton-loader" class="app-skeleton-loader">
        <div class="skeleton-row large">
            <div class="skel-side"><div class="skel-square"></div><div class="skel-line-short"></div></div>
            <div class="skel-circle"></div>
            <div class="skel-side"><div class="skel-square"></div><div class="skel-line-short"></div></div>
        </div>
        <div class="skeleton-row small">
            <div class="skel-line-long"></div>
            <div class="skel-pill"></div>
            <div class="skel-line-long"></div>
        </div>
        <div class="skeleton-row small">
            <div class="skel-line-long"></div>
            <div class="skel-pill"></div>
            <div class="skel-line-long"></div>
        </div>
    </div>

    <!-- SPA Root -->
    <div id="app-root">
        <!-- Layout components will be mounted here by initAppLayout() -->
        <div id="app-sidebar"></div>
        
        <div class="app-container">
            <div class="main-layout">
                <div id="app-header-container"></div>
                
                <!-- Main Content Viewport -->
                <main class="content-container" id="app-main">
                    <!-- Dynamic pages render here -->
                </main>
            </div>
        </div>

        <div id="mobile-bottom-nav-container"></div>
    </div>

    <!-- Toast Notifications Container -->
    <div id="toast-container" class="toast-container"></div>

    <!-- Modal Container -->
    <div id="modal-root"></div>

    <!-- Main SPA Application Module -->
    <script type="module" src="/src/app.js"></script>
    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
</body>
</html>
